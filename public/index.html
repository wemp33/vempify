<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vempify</title>

  <meta name="description" content="Vempify - your own music library." />
  <meta name="theme-color" content="#0b0b0f" />
  <meta name="color-scheme" content="dark" />

  <!-- iOS home-screen install -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vempify" />
  <meta name="format-detection" content="telephone=no" />

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
  <!-- iOS will not accept an SVG here, so this must stay a real PNG
       (generated by tools/make-icons.mjs). -->
  <link rel="apple-touch-icon" href="/icons/icon-180.png" sizes="180x180" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <svg class="logo" viewBox="0 0 512 512" role="img" aria-label="Vempify" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="brand-grad" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#c084fc" />
              <stop offset="1" stop-color="#8b5cf6" />
            </linearGradient>
          </defs>
          <g fill="none" stroke="url(#brand-grad)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
            <line x1="61" y1="41" x2="256" y2="399" />
            <line x1="451" y1="41" x2="256" y2="399" />
          </g>
          <polygon points="256,370 205,461 307,461" fill="url(#brand-grad)" />
        </svg>
        <span class="wordmark">Vempify</span>
      </div>

      <div class="header-search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="6.5" />
          <line x1="16" y1="16" x2="21" y2="21" />
        </svg>
        <input
          id="search"
          type="search"
          class="search-input"
          placeholder="Search"
          aria-label="Search"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"
          enterkeyhint="search"
        />
      </div>

      <button id="lang-toggle" type="button" class="lang-toggle" aria-label="Switch language">EN</button>
    </header>

    <div class="layout">
      <nav id="sidebar" class="sidebar" aria-label="Library"></nav>
      <main id="main" class="main" aria-live="polite"></main>
    </div>

    <footer id="now-playing" class="now-playing" aria-label="Now playing">
      <!-- Blurred artwork wash; a module sets background-image here. -->
      <div class="ambient-bg now-playing-bg" aria-hidden="true"></div>
      <div class="now-playing-scrim" aria-hidden="true"></div>

      <div class="now-playing-content">
        <div class="now-playing-track">
          <div class="now-playing-art" aria-hidden="true"></div>
          <div class="now-playing-meta">
            <div id="now-playing-title" class="now-playing-title">Not playing</div>
            <div id="now-playing-artist" class="now-playing-artist">&mdash;</div>
          </div>
        </div>

        <div class="now-playing-controls">
          <div class="transport-buttons">
            <button id="shuffle-btn" type="button" class="icon-btn" aria-label="Shuffle" aria-pressed="false">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 7h2.6c1.5 0 2.5.8 3.4 2l3.6 5c.9 1.2 1.9 2 3.4 2H20" />
                <path d="M3 17h2.6c1.5 0 2.5-.8 3.4-2" />
                <path d="M15.6 9c.9-1.2 1.9-2 3.4-2H20" />
                <polyline points="17.8 4.8 20.2 7 17.8 9.2" />
                <polyline points="17.8 14.8 20.2 17 17.8 19.2" />
              </svg>
            </button>

            <button id="prev-btn" type="button" class="icon-btn" aria-label="Previous track">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <line x1="6" y1="5.5" x2="6" y2="18.5" />
                <polygon class="solid" points="19,5.5 19,18.5 9,12" />
              </svg>
            </button>

            <button id="play-pause" type="button" class="icon-btn play-btn" aria-label="Play" aria-pressed="false">
              <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <polygon class="solid" points="7.5,5 19,12 7.5,19" />
              </svg>
              <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <rect class="solid" x="7" y="5" width="3.6" height="14" rx="1.4" />
                <rect class="solid" x="13.4" y="5" width="3.6" height="14" rx="1.4" />
              </svg>
            </button>

            <button id="next-btn" type="button" class="icon-btn" aria-label="Next track">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <line x1="18" y1="5.5" x2="18" y2="18.5" />
                <polygon class="solid" points="5,5.5 5,18.5 15,12" />
              </svg>
            </button>

            <button id="repeat-btn" type="button" class="icon-btn" aria-label="Repeat" aria-pressed="false" data-mode="off">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M17 6H9a4 4 0 0 0-4 4v1" />
                <polyline points="14.6 3.4 17.2 6 14.6 8.6" />
                <path d="M7 18h8a4 4 0 0 0 4-4v-1" />
                <polyline points="9.4 20.6 6.8 18 9.4 15.4" />
              </svg>
            </button>
          </div>

          <div class="seek-row">
            <input id="seek" type="range" class="range-input seek" min="0" max="100" value="0" step="0.1" aria-label="Seek" />
          </div>
        </div>

        <div class="now-playing-volume">
          <svg class="icon icon-volume" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <polygon class="solid" points="4,9.5 7.5,9.5 12,5.5 12,18.5 7.5,14.5 4,14.5" />
            <path d="M15.5 9.2a4 4 0 0 1 0 5.6" />
            <path d="M18 6.8a7.5 7.5 0 0 1 0 10.4" />
          </svg>
          <input id="volume" type="range" class="range-input volume" min="0" max="1" value="1" step="0.01" aria-label="Volume" />
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="/js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
