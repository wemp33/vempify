<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vempify</title>
  <meta name="theme-color" content="#0b0b0f" />
  <meta name="robots" content="noindex, nofollow" />
  <!-- The gate redirects logged-out visitors here, so this is often the page
       iOS actually reads during Add to Home Screen. Without the manifest and
       the apple-* metas the install comes out as a plain bookmark that opens
       with full Safari chrome instead of a standalone app. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vempify" />
  <!-- Same raster set as the app shell. iOS refuses an SVG for the home-screen
       icon anyway, and the bare mark is transparent, so both of these are the
       PNG tiles. /icons/ is open to unauthenticated requests, so they resolve
       on the login page itself, in front of the gate. -->
  <link rel="icon" href="/icons/icon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" sizes="180x180" />
  <!-- Self-contained on purpose: app.css sits behind the gate, so this page
       cannot depend on it. All styles are inline below. -->
  <style>
    :root {
      --bg: #0b0b0f;
      --surface: #16161d;
      --surface-2: #1e1e27;
      --border: #2a2a35;
      --text: #f4f4f7;
      --muted: #9b9baa;
      --accent: #a855f7;
      --accent-2: #e879f9;
      --accent-soft: rgba(168, 85, 247, 0.16);
      --accent-glow: rgba(168, 85, 247, 0.32);
      --on-accent: #1a0326;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      padding-left: max(24px, env(safe-area-inset-left));
      padding-right: max(24px, env(safe-area-inset-right));
    }

    /* Soft violet wash behind the card so the page is not a flat rectangle. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(60% 45% at 50% 0%, var(--accent-soft), transparent 70%),
        radial-gradient(45% 35% at 50% 100%, rgba(232, 121, 249, 0.08), transparent 70%);
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px 26px 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    /* Kept in step with .logo-tile in app.css. This page sits in front of the
       password gate, where app.css is not reachable, so the tile has to be
       restated here rather than shared - change one, change the other.
       Black mark on light purple; the tile is what makes it legible on the
       dark ground. Small chamfer, not a pill: the mark is angular. */
    .logo-tile {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      background: #c4b5fd;
      color: #000;
      border-radius: 5px;
    }

    /* Sized by width, height follows: the mark is 298x258, wider than tall.
       The 6% nudge answers a measurement, not a hunch - the ink centroid sits
       20% of the mark's height above its bounding-box centre, so box-centred
       it reads as sitting high. See the longer note in app.css. */
    .logo-tile .logo {
      display: block;
      width: 62%;
      height: auto;
      aspect-ratio: 298 / 258;
      transform: translateY(6%);
    }

    .wordmark {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .tagline {
      margin: 0 0 24px;
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .error {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      margin-bottom: 18px;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid rgba(248, 113, 113, 0.35);
      background: rgba(248, 113, 113, 0.1);
      color: #fca5a5;
      font-size: 0.875rem;
      line-height: 1.4;
    }

    .error[hidden] { display: none; }

    .error svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      margin-top: 1px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--muted);
    }

    .password-input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      font-size: 1rem;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .password-input::placeholder { color: #6c6c7a; }

    .password-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .submit-btn {
      width: 100%;
      min-height: 48px;
      margin-top: 16px;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: var(--on-accent);
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .submit-btn:hover { background: var(--accent-2); }

    .submit-btn:focus-visible {
      outline: 2px solid var(--accent-2);
      outline-offset: 2px;
    }

    .submit-btn:active { transform: translateY(1px); }

    .note {
      margin: 20px 0 0;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* A device that still holds a device token re-authenticates silently before
       this page is ever shown (see the script below). Only the card is hidden,
       so the violet wash still reads as the app rather than as a blank screen,
       and the class comes off the instant the attempt settles - or after four
       seconds if the request hangs. */
    html.resuming .card { visibility: hidden; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
  <script>
    /* Silent re-login. iOS gives a standalone PWA its own storage container and
       evicts cookies from it aggressively, so the session cookie alone cannot
       promise "type the password once per device". A device token stored here
       at the first successful login buys a fresh cookie back without the user
       seeing anything.

       Runs in <head>, before the card paints, so the honest case (a valid
       token) never flashes a password form the user does not need to fill in.
       Everything is wrapped: localStorage throws outright in some privacy
       modes, and a failure there must still end with a usable form. */
    (function () {
      var KEY = 'vempify_device_token';

      // ?error=1 means a password was just submitted and refused. Whoever is
      // at the keyboard is deliberately typing into this form, so resuming
      // them past it - even with a token that would work - is the wrong
      // answer; show the error and let them try again.
      if (location.search.indexOf('error') !== -1) return;

      var token = null;
      try {
        token = window.localStorage.getItem(KEY);
      } catch (e) {
        token = null;
      }
      if (!token) return; // nothing stored: the form paints normally

      var root = document.documentElement;
      root.classList.add('resuming');

      var settled = false;

      function showForm() {
        if (settled) return;
        settled = true;
        root.classList.remove('resuming');
        // autofocus is skipped while the card is hidden, so restore it by hand.
        var focusInput = function () {
          var input = document.getElementById('password');
          if (input) {
            try {
              input.focus();
            } catch (e) {
              /* focus refused - the form is still usable */
            }
          }
        };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', focusInput, { once: true });
        } else {
          focusInput();
        }
      }

      // The backstop: no matter how the request behaves, nobody is left staring
      // at an empty page for more than four seconds.
      var timer = setTimeout(showForm, 4000);

      function forgetToken() {
        try {
          window.localStorage.removeItem(KEY);
        } catch (e) {
          /* storage unavailable */
        }
      }

      try {
        fetch('/auth/resume', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token })
        }).then(
          function (response) {
            if (response.ok) {
              // The cookie is set. Replace rather than assign so Back cannot
              // land the user on a login page they no longer need.
              clearTimeout(timer);
              settled = true; // the redirect IS the outcome - do not flash the form
              window.location.replace('/');
              return;
            }
            // The server looked at the token and refused it. A 5xx is not the
            // token's fault, so only a client-side rejection discards it.
            if (response.status >= 400 && response.status < 500) forgetToken();
            clearTimeout(timer);
            showForm();
          },
          function () {
            // Offline or the request failed to leave the device: keep the token,
            // it is probably still good, and just show the form.
            clearTimeout(timer);
            showForm();
          }
        );
      } catch (e) {
        clearTimeout(timer);
        showForm();
      }
    })();
  </script>
</head>
<body>
  <main class="card">
    <div class="brand" role="img" aria-label="Vempify">
      <span class="logo-tile" aria-hidden="true">
        <svg class="logo" viewBox="0 0 298 258" fill="currentColor" fill-rule="evenodd" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <path d="M0,0L73,0L73,1L74,1L74,3L75,3L75,5L77,6L77,8L78,8L79,12L81,13L82,17L84,18L84,20L85,20L86,24L88,25L88,27L89,27L90,31L92,32L93,36L95,37L95,39L96,39L97,43L99,44L99,46L100,46L101,50L103,51L103,53L104,53L105,57L107,58L107,60L108,60L109,64L111,65L112,69L114,68L114,66L116,65L117,61L119,60L119,58L120,58L121,54L123,53L123,51L124,51L125,47L127,46L127,44L128,44L129,40L131,39L131,37L132,37L133,33L135,32L136,28L138,27L138,25L139,25L140,21L142,20L142,18L143,18L144,14L146,13L147,9L149,8L149,6L150,6L150,4L151,4L151,2L152,2L153,0L298,0L298,1L297,1L296,5L294,6L294,8L293,8L292,12L290,13L290,15L289,15L288,19L286,20L285,24L283,25L283,27L282,27L281,31L279,32L279,34L278,34L277,38L275,39L275,41L274,41L273,45L271,46L271,48L270,48L269,52L267,53L267,55L266,55L265,59L263,60L262,64L260,65L259,69L186,69L186,70L187,70L187,72L188,72L188,74L189,74L189,76L191,77L192,81L194,82L194,84L195,84L196,88L198,89L198,91L199,91L200,95L202,96L202,98L203,98L204,102L206,103L207,107L209,108L209,110L210,110L211,114L213,115L213,117L214,117L215,121L217,122L218,126L220,127L220,129L221,129L222,133L220,134L220,136L219,136L218,140L216,141L216,143L215,143L214,147L212,148L212,150L211,150L210,154L208,155L208,157L207,157L207,159L205,160L205,162L204,162L203,166L201,167L201,169L200,169L199,173L197,174L197,176L196,176L195,180L193,181L192,185L190,186L190,188L189,188L188,192L186,193L186,195L185,195L184,199L182,200L181,204L179,205L179,207L178,207L177,211L175,212L175,214L174,214L173,218L171,219L171,221L170,221L169,225L167,226L167,228L166,228L165,232L163,233L162,237L160,238L160,240L159,240L158,244L156,245L156,247L155,247L154,251L152,252L151,256L148,258L148,256L147,256L146,252L144,251L144,249L143,249L142,245L140,244L139,240L137,239L137,237L136,237L135,233L133,232L133,230L132,230L131,226L129,225L129,223L128,223L127,219L125,218L124,214L122,213L122,211L121,211L120,207L118,206L118,204L117,204L116,200L114,199L113,195L185,195L185,193L183,192L182,188L180,187L180,185L179,185L178,181L176,180L176,178L175,178L174,174L172,173L         </svg>
      </span>
      <span class="wordmark">Vempify</span>
    </div>

    <p class="tagline">This library is private. Enter the password to continue.</p>

    <div class="error" id="error" role="alert" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <line x1="12" y1="7.5" x2="12" y2="13" />
        <line x1="12" y1="16.5" x2="12" y2="16.5" />
      </svg>
      <span>Wrong password. Please try again.</span>
    </div>

    <form method="post" action="/login">
      <label class="field-label" for="password">Password</label>
      <input
        class="password-input"
        id="password"
        type="password"
        name="password"
        autocomplete="current-password"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="Password"
        required
        autofocus
      />
      <button class="submit-btn" type="submit">Unlock</button>
    </form>

    <p class="note">Vempify &mdash; your own music, your own server.</p>
  </main>

  <script>
    // The page is served as a static file, so the ?error=1 flag from the failed
    // POST redirect is read here rather than templated in.
    if (new URLSearchParams(location.search).has('error')) {
      document.getElementById('error').hidden = false;
    }
  </script>
</body>
</html>
